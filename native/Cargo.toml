[package]
name = "uia-probe"
version = "0.1.0"
edition = "2021"
description = "Windows UIA text-selection probe (Chromium PoC) — napi-rs addon"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16.13", default-features = false, features = ["napi8"] }
napi-derive = "2.16.13"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
napi-build = "2.1.3"

[profile.release]
strip = "symbols"
